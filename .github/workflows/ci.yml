name: Monorepo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  operations:
    name: Operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup script syntax
        run: sh -n ops/postgres-backup/backup.sh
      - name: Build backup worker container
        run: docker build --file ops/postgres-backup/Dockerfile --tag hcbe-postgres-backup:${{ github.sha }} .
      - name: Verify PostgreSQL backup runtime
        run: |
          docker run --rm --entrypoint sh hcbe-postgres-backup:${{ github.sha }} -c '
            set -eu
            command -v pg_dump
            command -v pg_restore
            command -v gosu
            command -v aws
            command -v gpg
            work_directory="$(mktemp -d)"
            postgres_directory="$work_directory/postgres"
            socket_directory="$work_directory/socket"
            chown postgres:postgres "$work_directory"
            install -d -o postgres -g postgres "$postgres_directory" "$socket_directory"
            gosu postgres initdb -D "$postgres_directory" --auth=trust --no-locale >/dev/null
            gosu postgres pg_ctl -D "$postgres_directory" -o "-k $socket_directory -c listen_addresses=" -w start >/dev/null
            psql --host="$socket_directory" --username=postgres --dbname=postgres --command="SELECT 1;" >/dev/null
            gosu postgres pg_ctl -D "$postgres_directory" -m fast -w stop >/dev/null
          '

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcbe-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore HcbeApi.sln
      - name: Build
        run: dotnet build HcbeApi.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test HcbeApi.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Verify idempotent PostgreSQL migrations
        env:
          Database__Provider: PostgreSQL
          ConnectionStrings__DefaultConnection: Host=localhost;Database=hcbe_validation;Username=validation;Password=validation-only
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.0
          dotnet ef migrations script --idempotent --no-build --configuration Release --output migration.sql
          test -s migration.sql
      - name: Build API container
        run: docker build --tag hcbe-api:${{ github.sha }} .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: hcbe-backend/TestResults

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://127.0.0.1:8080
      VITE_ENABLE_MEMBER_LOGIN: 'true'
      E2E_ADMIN_EMAIL: e2e-admin@hcbe.invalid
      E2E_ADMIN_PASSWORD: HCBE-E2E-Only-2026!
    defaults:
      run:
        working-directory: hcbe-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hcbe-frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Prepare full-stack test database
        working-directory: hcbe-backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__Provider: SQLite
          ConnectionStrings__DefaultConnection: Data Source=/tmp/hcbe-e2e.db
          JwtSettings__Secret: HCBE-E2E-JWT-secret-that-is-longer-than-32-characters
          Cors__AllowedOrigins__0: http://127.0.0.1:4173
          HCBE_ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          HCBE_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: |
          rm -f /tmp/hcbe-e2e.db /tmp/hcbe-api.log
          dotnet restore HcbeApi.sln
          dotnet run --project HcbeApi.csproj --no-launch-profile -- CreateAdmin
      - name: Start test API
        working-directory: hcbe-backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__Provider: SQLite
          ConnectionStrings__DefaultConnection: Data Source=/tmp/hcbe-e2e.db
          JwtSettings__Secret: HCBE-E2E-JWT-secret-that-is-longer-than-32-characters
          Cors__AllowedOrigins__0: http://127.0.0.1:4173
        run: |
          dotnet run --project HcbeApi.csproj --no-launch-profile --urls http://127.0.0.1:8080 > /tmp/hcbe-api.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          cat /tmp/hcbe-api.log
          exit 1
      - name: Full-stack Playwright tests
        run: npm run test:e2e
      - name: Build frontend container
        run: docker build --tag hcbe-frontend:${{ github.sha }} .
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: hcbe-frontend/out
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          path: |
            hcbe-frontend/playwright-report
            hcbe-frontend/test-results
            /tmp/hcbe-api.log
