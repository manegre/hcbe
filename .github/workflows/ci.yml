name: Monorepo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcbe-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore HcbeApi.sln
      - name: Build
        run: dotnet build HcbeApi.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test HcbeApi.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Verify idempotent PostgreSQL migrations
        env:
          Database__Provider: PostgreSQL
          ConnectionStrings__DefaultConnection: Host=localhost;Database=hcbe_validation;Username=validation;Password=validation-only
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.0
          dotnet ef migrations script --idempotent --no-build --configuration Release --output migration.sql
          test -s migration.sql
      - name: Build API container
        run: docker build --tag hcbe-api:${{ github.sha }} .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: hcbe-backend/TestResults

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcbe-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hcbe-frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Build frontend container
        run: docker build --tag hcbe-frontend:${{ github.sha }} .
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: hcbe-frontend/out

