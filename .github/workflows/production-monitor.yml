name: Production uptime monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public application and API health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local url="$2"
            echo "Checking ${name}: ${url}"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --max-time 20 "$url" >/dev/null
          }
          check frontend https://hcbe.ca/
          check api-live https://api.hcbe.ca/health/live
          check api-ready https://api.hcbe.ca/health/ready

      - name: Open or update outage issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[uptime] HCBE production check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            const body = `Production health checks failed at ${new Date().toISOString()}.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }

      - name: Close recovered outage issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[uptime] HCBE production check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            for (const issue of issues.filter(item => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `All production checks recovered at ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'
              });
            }
