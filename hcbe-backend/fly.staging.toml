primary_region = 'yyz'

[build]

[deploy]
  release_command = 'dotnet HcbeApi.dll MigrateDatabase'

[env]
  ASPNETCORE_ENVIRONMENT = 'Staging'
  ASPNETCORE_URLS = 'http://+:8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
