version: "3.8"
services:
  hcbe-api:
    build: .
    container_name: hcbe-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/hcbe.db
    volumes:
      - ./wwwroot/uploads:/app/wwwroot/uploads
      - ./data:/app/data
    restart: unless-stopped