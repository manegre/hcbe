server {
    listen ${PORT};
    server_name _;

    # Google Identity Services uses a popup that reports its result to the
    # opener. Keep cross-origin isolation without blocking that postMessage.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
