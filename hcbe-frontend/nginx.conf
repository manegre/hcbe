server {
    listen ${PORT};
    server_name _;

    # Google Identity Services uses a popup that reports its result to the
    # opener. Keep cross-origin isolation without blocking that postMessage.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Keep Railway's generated hostname as an operational fallback, while
    # presenting a single canonical production origin to visitors and search engines.
    if ($host = frontend-production-910a.up.railway.app) {
        return 301 https://hcbe.ca$request_uri;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
